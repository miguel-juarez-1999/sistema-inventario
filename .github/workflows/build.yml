name: Build - Sistema de Inventario

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar y verificar sintaxis
        run: python -m compileall src

      - name: Ejecutar programa de prueba
        run: python src/busqueda.py
