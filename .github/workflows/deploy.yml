name: Despliegue del Sistema de Inventario

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a desplegar (por ejemplo v1.0.2)"
        required: true
        default: "v1.0.2"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar versión liberada
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.version }}
          fileName: sistema-inventario-${{ inputs.version }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Transferir paquete al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: sistema-inventario-${{ inputs.version }}.zip
          target: ~/sistema-inventario/

      - name: Preparar y ejecutar versión en el servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ~/sistema-inventario
            mkdir -p version-${{ inputs.version }}
            unzip -o sistema-inventario-${{ inputs.version }}.zip -d version-${{ inputs.version }}
            ln -sfn ~/sistema-inventario/version-${{ inputs.version }} ~/sistema-inventario/actual
            ls -R version-${{ inputs.version }}
            python3 actual/src/busqueda.py
